html,button,.clock{font-family:CP2Pretendard,sans-serif}.clock{font-variant-numeric:tabular-nums}.brand{font-weight:850}.menu-head h1,.intro h1,.value{font-weight:800}.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.tile b{font-weight:760}.tile small{font-weight:450}.tile[href="#draw"]{grid-column:1/-1;min-height:175px;flex-direction:row;align-items:center;padding-inline:clamp(20px,4vw,48px);background:linear-gradient(106deg,#a9ebd724,#e0e8e008 70%,#a9ebd71c);border-color:#a9ebd76b}.tile[href="#draw"] b{font-size:clamp(26px,3vw,42px);font-weight:840}.tile[href="#draw"] img{width:110px;height:110px}.home-link{display:inline-flex;align-items:center;min-height:40px;padding:6px 13px;border:1px solid #bcd6ce55;border-radius:22px;background:#c0e1d816;font-weight:680}.score{color:#b3f6de;font-weight:820}
@media(max-width:680px){.tiles{gap:8px}.tile{padding:12px 9px;min-height:135px}.tile b{font-size:clamp(15px,4.2vw,20px)}.tile small{font-size:12px;word-break:keep-all}.tile img,.tile .ticket-icon{width:42px;height:42px}.tile[href="#draw"]{min-height:145px}.tile[href="#draw"] img{width:84px;height:84px}.top-actions{gap:5px}.home-link{margin-right:0;padding:5px 8px}.brand{font-size:14px}}

main{padding-bottom:150px}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#sb{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 20px));max-height:70vh;overflow:auto;z-index:20;background:#16201fee;border:1px solid #a9ebd780;border-radius:22px;padding:12px 16px;backdrop-filter:blur(16px);box-shadow:0 10px 40px #0007}
#sb .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #ffffff14}
#sb .top{cursor:pointer;font-weight:750;border:0;background:none;color:inherit;font:inherit;width:100%;text-align:left;padding:4px 0}
#sb input,#award input{font:inherit;font-size:16px;padding:10px 14px;border-radius:12px;border:1px solid #ffffff40;background:#0c1312;color:#fff;min-width:0;flex:1}
#sb .win{background:#a9ebd722;border:1px solid #a9ebd7;border-radius:14px;padding:10px 12px;margin-bottom:8px;font-weight:800;color:#c7f9e9}
